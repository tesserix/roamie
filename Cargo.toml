[workspace]
resolver = "2"
members = ["services/api"]

[workspace.dependencies]
time = { version = "0.3", features = ["macros", "parsing"] }
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
gcp_auth = "0.12.7"
hex = "0.4.3"
hmac = "0.12.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace", "timeout", "limit", "request-id"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "time", "json", "migrate", "macros"] }
uuid = { version = "1", features = ["v7", "serde"] }

jsonwebtoken = { version = "10.3", default-features = false, features = ["aws_lc_rs"] }
