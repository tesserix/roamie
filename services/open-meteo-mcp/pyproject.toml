[project]
name = "roamie-open-meteo-mcp"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "tesserix-mcp-runtime @ https://github.com/tesserix/tesserix-mcp-runtime/releases/download/v0.1.0-rc.6/tesserix_mcp_runtime-0.1.0rc6-py3-none-any.whl",
  "httpx>=0.28,<0.29",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.12,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=9,<10", "pytest-asyncio>=1,<2", "pytest-cov>=7,<8",
  "asgi-lifespan>=2.1,<3",
  "ruff>=0.14,<1", "mypy>=1.18,<3", "pip-audit>=2.9,<3",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.hatch.build.targets.wheel]
packages = ["src/open_meteo_mcp"]
