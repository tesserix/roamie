name: Mobile verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx --no-install tsc --noEmit
      - run: npm run lint
      - run: npx --yes expo-doctor@1.20.4
      - name: Bundle both mobile platforms
        run: npx --no-install expo export --platform all --output-dir dist
        env:
          EXPO_PUBLIC_API_URL: https://roamie-api.tesserix.app
          EXPO_PUBLIC_AUTH_ENABLED: "true"
      - run: node --test ../../scripts/ci/*.test.mjs
