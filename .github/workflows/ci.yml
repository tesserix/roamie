name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: tesserix/tesserix-workflows/.github/workflows/ci.yml@62f7f663a98d5ef92567850dd03c8c2513c9068e # v2.3.0
    with:
      rust_enabled: true
      rust_toolchain: "1.97"
      rust_coverage_min_lines: 70
      expo_enabled: true
      expo_working_directory: apps/mobile
      expo_install_directory: apps/mobile
      expo_lockfile_path: apps/mobile/package-lock.json
      expo_node_version: 22.19.0
      expo_package_manager: npm
      containers_enabled: true
      container_images: >-
        {"include":[{"name":"roamie-api","context":".","dockerfile":"docker/api.Dockerfile","target":"","source_root":"services/api","build_args":"","requires_application_build_secret":false,"trivy_ignore_file":"","smoke_port":8080,"smoke_path":"/healthz"}]}

  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres@sha256:a85daf0dbd5e79586e850e3fe4b21b796799828ad015ce2166aeb98cc24da61c
        env:
          POSTGRES_PASSWORD: isolated-ci-only
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      ROAMIE_TEST_DATABASE_URL: postgres://roamie_migration_test:isolated-ci-only@localhost:5432/roamie_integration_test?sslmode=disable
      ROAMIE_TEST_RUNTIME_PASSWORD: isolated-ci-only
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Rust
        run: rustup toolchain install 1.97 --profile minimal && rustup default 1.97
      - name: Create isolated non-superuser database roles
        env:
          PGPASSWORD: isolated-ci-only
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE roamie_app LOGIN PASSWORD 'isolated-ci-only' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE ROLE roamie_migration_test LOGIN PASSWORD 'isolated-ci-only' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE DATABASE roamie_integration_test OWNER roamie_migration_test;
          SQL
      - name: Test migrations, role separation and database failure
        run: cargo test --locked -- --ignored
