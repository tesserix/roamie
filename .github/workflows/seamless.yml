name: Seamless model service
on:
  workflow_dispatch:
  pull_request:
    paths: ["services/seamless/**", ".github/workflows/seamless.yml"]
  push:
    branches: [main]
    paths: ["services/seamless/**", ".github/workflows/seamless.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.5"
          python-version: "3.12"
      - working-directory: services/seamless
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest tests -q
          uv build
  image:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: services/seamless
          platforms: linux/amd64
          load: true
          tags: roamie-seamless:smoke
          cache-from: type=gha,scope=roamie-seamless
          cache-to: type=gha,mode=max,scope=roamie-seamless
      - name: Check packaged CPU runtime without downloading weights
        run: |
          docker run --rm --read-only --tmpfs /tmp --entrypoint /app/.venv/bin/python roamie-seamless:smoke -c '
          import torch
          from transformers import AutoProcessor, SeamlessM4Tv2Model
          from roamie_seamless.main import app
          assert not torch.cuda.is_available()
          assert any(route.path == "/v1/translate" for route in app.routes)
          '
      - uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87
        with:
          image-ref: roamie-seamless:smoke
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker tag roamie-seamless:smoke "ghcr.io/tesserix/roamie-seamless:sha-${GITHUB_SHA}"
          docker push "ghcr.io/tesserix/roamie-seamless:sha-${GITHUB_SHA}"
      - id: gcp
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: projects/849928263410/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@tesseracthub-480811.iam.gserviceaccount.com
          project_id: tesseracthub-480811
          token_format: access_token
          create_credentials_file: false
      - name: Mark the scanned image for Kargo discovery
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GCP_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: |
          set -euo pipefail
          tag="deploy-${GITHUB_SHA::7}"
          digest=$(docker buildx imagetools inspect "ghcr.io/tesserix/roamie-seamless:sha-${GITHUB_SHA}" --format '{{.Manifest.Digest}}')
          docker buildx imagetools create --prefer-index=false --tag "ghcr.io/tesserix/roamie-seamless:${tag}" "ghcr.io/tesserix/roamie-seamless@${digest}"
          printf '%s' "$GCP_TOKEN" | docker login asia-south1-docker.pkg.dev -u oauth2accesstoken --password-stdin
          mirror="asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/roamie-seamless:${tag}"
          test "$(docker buildx imagetools inspect "$mirror" --format '{{.Manifest.Digest}}')" = "$digest"
          docker buildx imagetools create --prefer-index=false --tag "asia-south1-docker.pkg.dev/tesseracthub-480811/global/roamie-seamless:${tag}" "${mirror}@${digest}"
